[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
common = { path = "../common" }
futures-util = "0.3"
mime_guess = "2"
rand = "0.9"
rust-embed = "8.11.0"
serde_json = "1"
tokio = { version = "1.52.2", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
