[package]
name = "gdext"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ewebsock = "0.8"
wasm-bindgen = "0.2"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "emscripten")))'.dependencies.godot]
git = "https://github.com/godot-rust/gdext"
branch = "master"
features = ["api-custom"]

[target.'cfg(all(target_arch = "wasm32", target_os = "emscripten"))'.dependencies.godot]
git = "https://github.com/godot-rust/gdext"
branch = "master"
features = [
  "api-custom",
  "experimental-wasm",
  "experimental-wasm-nothreads",
  "lazy-function-tables",
]

